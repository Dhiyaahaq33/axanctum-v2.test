name: Test Binance Connectivity (manual)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Binance Spot + Futures
        run: |
          echo "== Binance Spot ping =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://api.binance.com/api/v3/ping
          echo "== Binance Futures ping =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://fapi.binance.com/fapi/v1/ping

      - name: Bybit
        run: |
          echo "== Bybit server time =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://api.bybit.com/v5/market/time
          echo "== Bybit kline (linear BTCUSDT) =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=60&limit=2"
          echo "== Bybit funding rate history =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=1"
          echo "== Bybit open interest =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=1h&limit=2"

      - name: OKX
        run: |
          echo "== OKX time =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://www.okx.com/api/v5/public/time
          echo "== OKX candles (BTC-USDT-SWAP) =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1H&limit=2"
          echo "== OKX funding rate =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"
          echo "== OKX open interest =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.okx.com/api/v5/public/open-interest?instId=BTC-USDT-SWAP"

      - name: HyperLiquid
        run: |
          echo "== HyperLiquid meta info (POST) =="
          curl -sS -w "\nHTTP %{http_code}\n" -X POST https://api.hyperliquid.xyz/info -H "Content-Type: application/json" -d '{"type":"meta"}'
          echo "== HyperLiquid funding history =="
          curl -sS -w "\nHTTP %{http_code}\n" -X POST https://api.hyperliquid.xyz/info -H "Content-Type: application/json" -d '{"type":"fundingHistory","coin":"BTC","startTime":1735689600000}'

      - name: Kraken Futures
        run: |
          echo "== Kraken Futures tickers =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://futures.kraken.com/derivatives/api/v3/tickers
          echo "== Kraken Futures history OHLC =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://futures.kraken.com/api/charts/v1/trade/PF_XBTUSD/1h?count=2"

      - name: Gate.io
        run: |
          echo "== Gate.io futures BTC_USDT contract =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://api.gateio.ws/api/v4/futures/usdt/contracts/BTC_USDT"
          echo "== Gate.io futures candles =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=1h&limit=2"

      - name: Runner egress info
        run: curl -sS https://ipinfo.io/json || true

      - name: OKX taker volume + raw candle shape
        run: |
          echo "== OKX taker-volume (CONTRACTS BTC) =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.okx.com/api/v5/rubik/stat/taker-volume?ccy=BTC&instType=CONTRACTS&period=1H"
          echo "== OKX taker-volume (SPOT BTC) =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.okx.com/api/v5/rubik/stat/taker-volume?ccy=BTC&instType=SPOT&period=1H"
          echo "== OKX raw swap candle sample =="
          curl -sS "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1H&limit=3"
          echo ""
          echo "== OKX raw spot candle sample =="
          curl -sS "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1H&limit=3"
          echo ""
          echo "== OKX open-interest-volume (long/short + OI) =="
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1H"
          echo "== OKX all SWAP tickers sample count =="
          curl -sS "https://www.okx.com/api/v5/market/tickers?instType=SWAP" | head -c 800
